name: Profile animations

# Rebuilds the live README cards (hero, profile scan, contribution graph,
# dev quote) from today's GitHub data. They're force-pushed to a one-commit
# `output` branch so main's history stays clean.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cards.py
      - .github/workflows/profile-animations.yml

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render live cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/cards.py live dist

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -qm "Update profile cards"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
