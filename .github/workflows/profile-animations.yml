name: Profile animations

# Rebuilds the two README visuals that GitSkins can't serve on request:
# the contribution Space Shooter GIF and the dev-quote card. Both are
# force-pushed to a one-commit `output` branch so main's history stays clean.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/quote_card.py
      - .github/workflows/profile-animations.yml

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render today's dev quote
        run: python scripts/quote_card.py dist/dev-quote.svg

      - name: Render contribution Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check "gh-space-shooter==2.0.4"
          gh-space-shooter ${{ github.repository_owner }} --output dist/space-shooter.gif --strategy random --fps 30

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-quote.svg space-shooter.gif
          git commit -qm "Update profile animations"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
