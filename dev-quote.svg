<svg xmlns="http://www.w3.org/2000/svg" width="860" height="184" viewBox="0 0 860 184" role="img" aria-label="Dev quote of the day: Fix the cause, not the symptom. by Steve Maguire">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a2b"/><stop offset=".55" stop-color="#0a1b1f"/><stop offset="1" stop-color="#0f2a36"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#5eead4" stroke-opacity=".05"/></pattern>
  <clipPath id="clip"><rect width="860" height="184" rx="16"/></clipPath>
  
</defs>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.label{font:700 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:4px;fill:#5eead4}
.orb{animation:drift 14s ease-in-out infinite alternate}
.orb2{animation-duration:18s;animation-direction:alternate-reverse}
.cursor{animation:blink 1s steps(1) infinite}
.rise{animation:rise .7s ease-out both}
@keyframes drift{to{transform:translate(60px,20px)}}
@keyframes blink{50%{opacity:0;fill-opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ring{animation:spin 24s linear infinite;transform-origin:770px 66px}@keyframes spin{to{transform:rotate(360deg)}}</style>
<g clip-path="url(#clip)">
<rect width="860" height="184" fill="url(#bg)"/>
<circle class="orb" cx="120" cy="10" r="120" fill="#14b8a6" opacity=".45" filter="url(#blur)"/>
<circle class="orb orb2" cx="559" cy="184" r="130" fill="#3b82f6" opacity=".35" filter="url(#blur)"/>
<circle class="orb" cx="840" cy="92" r="90" fill="#2dd4bf" opacity=".3" filter="url(#blur)"/>
<rect x="20" y="20" width="820" height="144" rx="14" fill="#0a1f22" fill-opacity=".55" stroke="#2dd4bf" stroke-opacity=".35"/>

<g class="ring" opacity=".35" fill="none" stroke="#5eead4"><circle cx="770" cy="66" r="30"/><circle cx="770" cy="66" r="18"/><circle cx="800" cy="66" r="3" fill="#5eead4"/></g>
<text class="label" x="56" y="58">DEV QUOTE</text>
<text class="mono" x="590" y="58" font-size="13" font-weight="600" fill="#5eead4">&gt; quote.random<tspan class="cursor"> _</tspan></text>
<text class="rise" x="56" y="98" font-size="24" font-weight="600" fill="#e6fffa"><tspan x="56" dy="0">“Fix the cause, not the symptom.”</tspan></text>
<text class="mono rise" x="56" y="146" font-size="14" fill="#5eead4" style="animation-delay:.5s">— Steve Maguire</text>
<text class="mono" x="820" y="172" text-anchor="end" font-size="11" fill="#5eead4" opacity=".55">#18 · refreshed daily</text>
<rect x=".5" y=".5" width="859" height="183" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity=".45"/>
</g>
</svg>
